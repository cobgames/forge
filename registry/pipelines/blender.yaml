pitfalls:
  - text: 衣冠 mesh 槽不吃 dx/dy，要 align_to_stencil；mipmap 开关在 .atlas 的 filter 行；装饰线源图 ≥6–8px；面罩跨物种用 faceAnchor:nose
    evidence: pawkov 衣冠件实装记录
    source: workspace auto-memory（reference_pawkov_costume_mesh_pipeline）
  - text: 自绘物种件不加 rim 描边（外圈略深灰边要去掉）；内部结构线照留
    evidence: 未量化（制作人规则）
    source: workspace auto-memory（feedback_self_drawn_species_no_rim）
  - text: LoRA 训练集绝不用有缺陷 / 没达预期的图
    evidence: 未量化（garbage in garbage out）
    source: workspace auto-memory（feedback_lora_trainset_quality）
