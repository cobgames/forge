pitfalls:
  - text: 验收截图须含制作人 4K 视口（3840×1907），默认 1080p + 4K 两套；DOM UI 须随视口缩放，不能裸 px
    evidence: 制作人浏览器 3840×1907，只截 1080p 漏掉缩放问题
    source: workspace auto-memory（feedback_screenshot_at_producer_resolution）
  - text: 先确认渲染的是目标素材本身而非背景 / 它件冒充；三处都对却异常时用 tint / 纯色探针排查
    evidence: 一行多语句的行尾注释吞掉 addChild
    source: workspace auto-memory（feedback_verify_rendered_asset_not_proxy）
  - text: 本地 file:// 的 <img> 当 WebGL 纹理会跨源报错空白；改 data-URI 或起服务器
    evidence: texImage2D 跨源报错，Canvas2D 不受影响
    source: workspace auto-memory（reference_webgl_fileurl_datauri）
  - text: 端口冲突：pawkov 8378/8380/8381/8388 与 blender-lab 8381 撞，启动前扫端口
    evidence: 未量化
    source: workspace auto-memory（reference_pawkov_ports_8381_collision）
  - text: MCP 浏览器窗口 hidden 会让画布全黑
    evidence: dragon-cliff-three 截图全黑
    source: workspace auto-memory（project_dragon_cliff_three）
  - text: headless shell 是 SwiftShader，FPS 数字作废；并行多个 WebGL 上下文时游戏时间会漂移
    evidence: 外部项目记录（作者自述）
    source: docs/projects/threejs-game-skills
