pitfalls:
  - text: 抖动靠后处理钉脚底，不靠 prompt；稳定 = 锁 feetY 锚点而非锁尺寸
    evidence: normalize 平移 pin 脚底后漂移 271px → 1px
    source: workspace auto-memory（feedback_sprite_jitter_postprocess_not_prompt）
  - text: 呼吸动画不用整体 scale；上半身微动 + 下半身锁定
    evidence: 未量化（制作人规则）
    source: workspace auto-memory（feedback_breathing_no_scale）
  - text: 系列出图先定一个 anchor 标准物，再 ref 它生成其余
    evidence: 不定 anchor 时尺寸 / 构图 / 风格各自漂
    source: workspace auto-memory（feedback_series_anchor_standard）
  - text: 同稀有度跨类型边框 / 件坐标必须一致；同 master ref 生成后 harness 比对
    evidence: 跨类型不一致时失去整体产品感
    source: workspace auto-memory（feedback_cross_type_frame_consistency）
